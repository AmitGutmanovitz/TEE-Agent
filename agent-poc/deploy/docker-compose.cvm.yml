services:
  agent:
    image: amitgut3210/verifiable-agent@sha256:acc5851baa5e0c38859f2847c2c0216c1e56fa519822052b9d0f3b31600c0736 # agent-image
    ports:
      - "8000:8000"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - agent-data:/data
    environment:
      - LLM_BACKEND=openai
      - PHALA_API_KEY=${PHALA_API_KEY}
      - OPEN_AI_API_KEY=${OPEN_AI_API_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - CHAT_TOKEN=${CHAT_TOKEN}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  demo:
    image: amitgut3210/verifiable-agent-demo@sha256:bbc69a14fd5a652abcd646cb8e98113be41b49fda4d2ac94ead3754bce5b3efe # demo-image
    ports:
      - "8080:8080"
    environment:
      - AGENT_URL=http://agent:8000
      - PHALA_API_KEY=${PHALA_API_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - CHAT_TOKEN=${CHAT_TOKEN}
      - DEMO_TOKEN=${DEMO_TOKEN}
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  agent-data:
